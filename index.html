<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #fde2e4 0%, #e2ece9 50%, #dfe7fd 100%);
      color: #4a4a68;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      background: #fffafc;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(120, 120, 160, 0.18);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
      color: #5e548e;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      font-size: 0.95rem;
      color: #7d7a9b;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      font-size: 1rem;
      color: #3d3d5c;
      background: #ffffff;
      border: 1.5px solid #cdb4db;
      border-radius: 10px;
      outline: none;
    }

    input:focus {
      border-color: #7c6fb0;
      box-shadow: 0 0 0 3px rgba(205, 180, 219, 0.45);
    }

    button {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: #9d8ec4;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #8576b5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Registration Form</h1>
    <p class="subtitle">Please fill in your details below.</p>

    <form id="registration-form" action="#" method="post">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required>
      </div>

      <div class="field">
        <label for="contact">Contact Number</label>
        <input type="tel" id="contact" name="contact" placeholder="10-digit mobile number"
               pattern="[0-9]{10}" maxlength="10" title="Enter a 10-digit number (digits only)" required>
      </div>

      <button type="submit" id="submit-btn">Submit</button>
    </form>
  </div>
</body>
</html>
